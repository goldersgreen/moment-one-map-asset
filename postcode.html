<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>주소 검색</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
  #container { width:100%; height:100%; }
</style>
</head>
<body>
<div id="container"></div>
<!-- 다음(카카오) 우편번호 서비스 — 무료, 키 불필요 -->
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
  new daum.Postcode({
    oncomplete: function (data) {
      // 도로명 우선, 없으면 지번
      var addr = data.roadAddress || data.jibunAddress || '';
      // 법정동/건물명 참고 표기 (도로명 선택 시)
      var extra = '';
      if (data.userSelectedType === 'R') {
        if (data.bname && /[동|로|가]$/g.test(data.bname)) extra += data.bname;
        if (data.buildingName && data.apartment === 'Y')
          extra += (extra ? ', ' : '') + data.buildingName;
        if (extra) addr += ' (' + extra + ')';
      }
      var payload = { zonecode: data.zonecode || '', address: addr };
      // Flutter InAppWebView 핸들러로 전달 (앱)
      if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
        window.flutter_inappwebview.callHandler('onAddressSelected', payload);
      }
    },
    width: '100%',
    height: '100%'
  }).embed(document.getElementById('container'));
</script>
</body>
</html>
