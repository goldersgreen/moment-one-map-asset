<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Moment One Map</title>
  <style>
    html, body { margin:0; padding:0; height:100%; overflow:hidden; }
    #map { width:100%; height:100%; }
    .diag {
      padding:18px; font-family:-apple-system,sans-serif; height:100%;
      box-sizing:border-box; background:#FFF5F0; color:#0F2236; overflow-y:auto;
    }
    .diag h3 { color:#E55A26; margin:0 0 10px; }
    .diag .item { margin:6px 0; font-size:12px; line-height:1.5; }
    .diag .ok { color:#27AE60; } .diag .err { color:#E74C3C; }
    .diag code { background:#fff; padding:1px 4px; border-radius:3px; font-size:11px; }
    .diag .hint { margin-top:14px; padding:10px; background:#fff; border-radius:8px;
                  font-size:11px; color:#6B7280; line-height:1.6; }

    /* 매장 마커 (CustomOverlay) — 카테고리별 색/아이콘 + 매장명 라벨 */
    .mo-marker {
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; user-select: none;
      font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      transform: translateY(-2px);
    }
    .mo-pin {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 16px; line-height: 1;
      border: 2px solid #fff;
      box-shadow: 0 2px 4px rgba(0,0,0,.25);
    }
    .mo-label {
      margin-top: 3px;
      padding: 2px 7px;
      max-width: 110px;
      background: #fff;
      border-radius: 10px;
      font-size: 11px; font-weight: 700; color: #0F2236;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
    }
    /* 카테고리별 색상 (Place 모델의 PlaceCategory.name 매칭) */
    .mo-cat-cafe       { background: #8B5A2B; }
    .mo-cat-grooming   { background: #FF6B35; }
    .mo-cat-hotel      { background: #7A6CD9; }
    .mo-cat-daycare    { background: #F5A623; }
    .mo-cat-hospital   { background: #4DA6FF; }
    .mo-cat-training   { background: #4DC07A; }
    .mo-cat-shop       { background: #E36B9D; }
    .mo-cat-restaurant { background: #E07A2E; }
    .mo-cat-park       { background: #5BAD3F; }
    .mo-cat-default    { background: #6B7280; }
    /* 산책 시작/종료 — 작은 발바닥 배지(시작 틸 / 종료 주황), 라벨 없음 */
    .mo-pin.mo-cat-start,
    .mo-pin.mo-cat-end { width: 22px; height: 22px; border-width: 2px;
                         box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .mo-cat-start      { background: #2BB6A3; font-size: 12px; }
    .mo-cat-end        { background: #FF6B35; font-size: 8px; letter-spacing: -1px; }

    /* 산책 사진 핀 — 앱의 kWalkPhotoKindHex 와 색이 같아야 한다(양쪽 따로 적음) */
    .mo-pin.mo-cat-wp_marking,
    .mo-pin.mo-cat-wp_poop,
    .mo-pin.mo-cat-wp_cute,
    .mo-pin.mo-cat-wp_etc { width: 26px; height: 26px; border-width: 2px;
                            font-size: 13px; cursor: pointer; }
    .mo-cat-wp_marking { background: #3B82C4; }
    .mo-cat-wp_poop    { background: #A0703C; }
    .mo-cat-wp_cute    { background: #E0568F; }
    .mo-cat-wp_etc     { background: #7A8794; }
    /* 파트너 매장 강조 (향후 partner 플래그 전달 시) */
    .mo-marker.partner .mo-pin {
      border-color: #FFD700; border-width: 3px;
    }
  </style>
  <script>
    // URL 쿼리 파라미터에서 키와 초기 좌표 읽기
    // 예: ?key=ABC&lat=37.5665&lng=126.978&level=3&interactive=true
    var params = new URLSearchParams(window.location.search);
    var KAKAO_KEY    = params.get('key') || '';
    var CENTER_LAT   = parseFloat(params.get('lat')) || 37.5665;
    var CENTER_LNG   = parseFloat(params.get('lng')) || 126.978;
    var INIT_LEVEL   = parseInt(params.get('level')) || 3;
    var INTERACTIVE  = params.get('interactive') !== 'false';

    // 진단 정보
    window._diag = {
      keyPreview: KAKAO_KEY.length >= 4
        ? KAKAO_KEY.substring(0,4) + '...' + KAKAO_KEY.substring(KAKAO_KEY.length-2)
        : '(짧음)',
      origin: window.location.origin || '(null)',
      href: window.location.href,
      sdkScriptError: null,
      consoleErrors: []
    };
    var _origErr = console.error;
    console.error = function() {
      window._diag.consoleErrors.push(Array.from(arguments).join(' '));
      _origErr.apply(console, arguments);
    };

    function showDiag() {
      var d = window._diag;
      var html = '<div class="diag"><h3>⚠ 카카오맵 SDK 로드 실패</h3>';
      html += '<div class="item"><b>키 prefix:</b> <code>' + d.keyPreview + '</code></div>';
      html += '<div class="item"><b>실제 origin:</b> <code>' + d.origin + '</code></div>';
      html += '<div class="item"><b>실제 href:</b> <code>' + d.href + '</code></div>';
      html += '<div class="item"><b>SDK 스크립트:</b> ' +
        (d.sdkScriptError ? '<span class="err">' + d.sdkScriptError + '</span>' :
         '<span class="ok">200 OK</span>') + '</div>';
      html += '<div class="item"><b>kakao 객체:</b> ' +
        (typeof kakao !== 'undefined' ?
          '<span class="ok">정의됨</span>' :
          '<span class="err">undefined</span>') + '</div>';
      if (d.consoleErrors.length > 0) {
        html += '<div class="item"><b>JS 콘솔 에러:</b><br>';
        d.consoleErrors.forEach(function(e) {
          html += '<code style="display:block;margin-top:3px;color:#E74C3C">' + e + '</code>';
        });
        html += '</div>';
      }
      html += '<div class="hint">';
      html += '<b>확인:</b><br>';
      html += '1. 카카오 디벨로퍼스 → JS 키 → JavaScript SDK 도메인에<br>';
      html += '&nbsp;&nbsp;&nbsp;&nbsp;<code>' + d.origin + '</code> 등록 후 저장<br>';
      html += '2. JS 키 prefix가 카카오 디벨로퍼스의 값과 일치하는지';
      html += '</div></div>';
      document.body.innerHTML = html;
    }
  </script>
</head>

    function _applyPolyline(coords) {
      if (!map) return;
      if (routeLine) routeLine.setMap(null);
      if (coords.length < 2) return;
      var path = coords.map(function(c) { return new kakao.maps.LatLng(c.lat, c.lng); });
      routeLine = new kakao.maps.Polyline({
        path: path,
        strokeWeight: 5,
        strokeColor: '#FF6B35',
        strokeOpacity: 0.85,
        strokeStyle: 'solid'
      });
      routeLine.setMap(map);
      // 화면 맞춤이 미리 요청됐으면(지도 준비 전 fitToPolyline 호출) 지금 적용
      if (pending.fit) { pending.fit = false; _doFit(); }

      wp_marking: '💧', wp_poop: '🌿', wp_cute: '💗', wp_etc: '···'
    };

    /* 핀을 누르면 앱으로 알린다. 지도는 폰 안의 사진 파일을 읽지 못하므로
       사진은 앱이 띄운다 — 여기서는 어느 핀인지만 넘긴다. */
    function _pinTap(id) {
      try {
        if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
          window.flutter_inappwebview.callHandler('onMarkerTap', id);
        }
      } catch (e) {}
    }
    function _escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function _applyMarkers(data) {
      if (!map) return;
      // 기존 마커(CustomOverlay) 정리
      markers.forEach(function(m) {
        if (m && m.setMap) m.setMap(null);
      });
      markers = [];
      if (openInfo) { openInfo.close(); openInfo = null; }

      data.forEach(function(m) {
        var cat = String(m.category || 'default').toLowerCase();
        var icon = CATEGORY_ICON[cat] || '🐾';
        var safeTitle = _escapeHtml(m.title || '매장');
        // 산책 시작/종료는 라벨 없이 발바닥 배지만(색·발바닥 개수로 구분)
        var isPhoto = cat.indexOf('wp_') === 0;
        var isWalk = (cat === 'start' || cat === 'end' || isPhoto);
        var labelHtml = isWalk ? '' : '<div class="mo-label">' + safeTitle + '</div>';

        var safeId = _escapeHtml(m.id || '');
        // 사진 핀만 탭을 받는다(매장·시작·종료 마커 동작은 그대로)
        var tapAttr = isPhoto
          ? ' onclick="_pinTap(&quot;' + safeId + '&quot;)"'
          : '';

        var content =
          '<div class="mo-marker mo-cat-wrap" data-id="' + safeId + '"' + tapAttr + '>' +
            '<div class="mo-pin mo-cat-' + cat + '">' + icon + '</div>' +
            labelHtml +
          '</div>';

        var overlay = new kakao.maps.CustomOverlay({
          position: new kakao.maps.LatLng(m.lat, m.lng),
          content: content,
          // 매장: yAnchor=1.0 (핀 아래 끝=좌표, 라벨 아래로). 산책 배지: 0.5(점 정중앙).
          yAnchor: isWalk ? 0.5 : 1.0,
          xAnchor: 0.5,
          zIndex: 5
        });
        overlay.setMap(map);
        markers.push(overlay);
      });
    }

    // Flutter 에서 호출하는 함수들 (map 없으면 큐에 보관)
    window.setCurrentLocation = function(lat, lng, follow) {
      if (!map) { pending.location = {lat:lat, lng:lng, follow:follow}; return; }
      _applyLocation(lat, lng, follow);
    };

    window.setPolyline = function(coordsJson) {
      var coords = JSON.parse(coordsJson);
      if (!map) { pending.polyline = coords; return; }
      _applyPolyline(coords);
    };

    window.setMarkers = function(markersJson) {
      var data = JSON.parse(markersJson);
      if (!map) { pending.markers = data; return; }
      _applyMarkers(data);
    };

    window.panTo = function(lat, lng) {
      if (!map) return;
      map.panTo(new kakao.maps.LatLng(lat, lng));
    };

    // 현재 polyline 전체가 화면에 들어오도록 줌·중심 자동 조정 (긴 산책 경로 표시용)
    function _doFit() {
      if (!map || !routeLine) return;
      var path = routeLine.getPath();
      if (!path || path.length < 2) return;
      var bounds = new kakao.maps.LatLngBounds();
      for (var i = 0; i < path.length; i++) {
        bounds.extend(path[i]);
      }
      // padding(px): 경로 끝점이 화면 가장자리에 딱 붙지 않도록 여백
      map.setBounds(bounds, 30, 30, 30, 30);
    }
    window.fitToPolyline = function() {
      // 지도(또는 경로)가 아직 준비 안 됐으면 큐잉 → 준비되면 _applyPolyline 이 적용.
      // (카카오맵은 onLoadStop 이후 비동기 생성 — 이 큐잉이 없으면 긴 경로 시작점이 잘림)
      if (map && routeLine) { _doFit(); pending.fit = false; }
      else { pending.fit = true; }
    };

    function bootMap() {
      var container = document.getElementById('map');
      var options = {
        center: new kakao.maps.LatLng(CENTER_LAT, CENTER_LNG),
        level: INIT_LEVEL,
        draggable: INTERACTIVE,
        scrollwheel: INTERACTIVE
      };
      map = new kakao.maps.Map(container, options);
      if (pending.location) _applyLocation(pending.location.lat, pending.location.lng, pending.location.follow);
      if (pending.polyline) _applyPolyline(pending.polyline);
      if (pending.markers)  _applyMarkers(pending.markers);
    }

    // 카카오 SDK 동적 로드 (URL 파라미터로 받은 키 사용)
    var sdkScript = document.createElement('script');
    sdkScript.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + KAKAO_KEY + '&autoload=false';
    sdkScript.onerror = function() {
      window._diag.sdkScriptError = 'script onerror (네트워크/도메인 차단)';
      showDiag();
    };
    sdkScript.onload = function() {
      setTimeout(function() {
        if (typeof kakao !== 'undefined' && kakao.maps && kakao.maps.load) {
          kakao.maps.load(bootMap);
        } else {
          showDiag();
        }
      }, 100);
    };
    document.head.appendChild(sdkScript);
  </script>
</body>
</html>
